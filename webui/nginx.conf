server {
    listen 8082;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Always revalidate the HTML shell so SPA updates are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Root-level images are not content-hashed; force revalidation after updates.
    location ~* ^/(.*\.(?:png|gif|jpg|jpeg|webp|svg))$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Serve static assets directly
    location /assets/ {
        try_files $uri =404;
    }

    # Reverse proxy for API requests
    location /api/ {
        proxy_pass http://api:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback for client-side routing
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri /index.html;
    }

    # Optional: basic gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 256;
}
